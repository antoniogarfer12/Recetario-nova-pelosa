name: Actualizar Excel de recetas

on:
  push:
    branches: [main]
    paths: [recetas.json, menu.json, scripts/generar_excel.py, .github/workflows/excel.yml]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: excel
  cancel-in-progress: false

jobs:
  excel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install openpyxl
      - run: python scripts/generar_excel.py
      - name: Subir recetas.xlsx
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add recetas.xlsx
          git diff --cached --quiet && exit 0
          git commit -m "Actualizar recetas.xlsx"
          for i in 1 2 3; do git pull --rebase && git push && exit 0; sleep 5; done
          exit 1
