<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mi recetario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#EEF2E6; --surface:#FFFFFF; --ink:#2B1E2F; --muted:#6B7062;
  --line:#D6DCCB; --accent:#E2B33C; --accent-ink:#2B1E2F; --danger:#B3402E;
  --serif:"Young Serif", Georgia, "Times New Roman", serif;
  --sans:"Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#1A1A17; --surface:#25251F; --ink:#ECE9DF; --muted:#A3A693;
    --line:#3A3B32; --accent:#E2B33C; --accent-ink:#1A1A17; --danger:#E0715E;
  }
}
:root[data-theme="dark"]{
  --bg:#1A1A17; --surface:#25251F; --ink:#ECE9DF; --muted:#A3A693;
  --line:#3A3B32; --accent:#E2B33C; --accent-ink:#1A1A17; --danger:#E0715E;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:1rem;line-height:1.5}
.wrap{max-width:46rem;margin:0 auto;padding:1.5rem 1rem 6rem}
h1,h2,h3{font-family:var(--serif);font-weight:400;margin:0;line-height:1.15}
h1{font-size:clamp(2.2rem,8vw,3.2rem)}
header p{color:var(--muted);margin:.4rem 0 1.4rem}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.bar{display:flex;gap:.6rem;flex-wrap:wrap;margin-bottom:1rem}
.search{flex:1 1 14rem;padding:.75rem 1rem;border:1.5px solid var(--line);border-radius:999px;background:var(--surface)}
.chips{display:flex;gap:.4rem;overflow-x:auto;padding-bottom:.3rem;margin-bottom:1.2rem}
.chip{border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:.35rem .9rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.btn{border:0;border-radius:.6rem;padding:.75rem 1.1rem;font-weight:600}
.btn-main{background:var(--accent);color:var(--accent-ink)}
.btn-ghost{background:transparent;border:1.5px solid var(--line)}
.btn-danger{background:transparent;color:var(--danger);border:1.5px solid currentColor}
.list{display:grid;gap:.9rem}
.card{position:relative;background:var(--surface);border-radius:.3rem .9rem .9rem .3rem;padding:1rem 1.1rem 1rem 1.5rem;border:1px solid var(--line);text-align:left;width:100%}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:.45rem;background:var(--accent);border-radius:.3rem 0 0 .3rem}
.card h3{font-size:1.3rem;margin-bottom:.3rem}
.meta{color:var(--muted);font-size:.9rem;display:flex;gap:1rem;flex-wrap:wrap}
.fav{position:absolute;right:.9rem;top:.8rem;font-size:1.2rem}
.empty{text-align:center;padding:3rem 1rem;color:var(--muted)}
.empty h2{color:var(--ink);font-size:1.6rem;margin-bottom:.5rem}
.fab{position:fixed;right:1rem;bottom:calc(1rem + env(safe-area-inset-bottom,0px));box-shadow:0 6px 18px rgba(43,30,47,.25);border-radius:999px;padding:1rem 1.4rem}
/* detalle y formulario */
.view{display:none}.view.on{display:block}
.back{background:none;border:0;color:var(--muted);padding:0;margin-bottom:1rem}
.detail h2{font-size:clamp(1.9rem,6vw,2.6rem);margin-bottom:.6rem}
.detail section{margin-top:1.6rem}
.detail h3{font-size:1.25rem;margin-bottom:.6rem}
.ing{list-style:none;padding:0;margin:0}
.ing li{padding:.5rem 0;border-bottom:1px dashed var(--line);display:flex;gap:.7rem;align-items:flex-start}
.ing input{width:1.2rem;height:1.2rem;margin-top:.2rem;accent-color:var(--accent)}
.ing li.done span{text-decoration:line-through;color:var(--muted)}
.steps{padding-left:1.4rem;margin:0}
.steps li{margin-bottom:.8rem;padding-left:.3rem}
.notes{background:var(--surface);border:1px solid var(--line);border-radius:.6rem;padding:.9rem 1rem;white-space:pre-wrap}
.actions{display:flex;gap:.6rem;flex-wrap:wrap;margin-top:2rem}
form label{display:block;font-weight:600;margin:1rem 0 .35rem}
form .hint{font-weight:400;color:var(--muted);font-size:.85rem}
form input,form textarea,form select{width:100%;padding:.7rem .85rem;border:1.5px solid var(--line);border-radius:.5rem;background:var(--surface)}
form textarea{min-height:7rem;resize:vertical}
.row{display:grid;grid-template-columns:repeat(auto-fit,minmax(9rem,1fr));gap:0 .8rem}
.toast{position:fixed;left:50%;bottom:calc(5.5rem + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.6rem 1.1rem;border-radius:999px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
@media (prefers-reduced-motion: reduce){.toast{transition:none}}
header .sync-line{margin-top:-1rem;font-size:.9rem}
.link{background:none;border:0;padding:0;color:inherit;text-decoration:underline;text-underline-offset:2px}
.btn[disabled]{opacity:.6;cursor:progress}
.pick{display:flex;gap:.5rem}
.pick select{flex:1;min-width:0}
.pick .btn{padding:0 1rem;font-size:1.3rem;line-height:1}
.tabs{display:flex;gap:.4rem;margin-bottom:1.2rem}
.tabs button{flex:1;border:1.5px solid var(--line);background:transparent;border-radius:999px;padding:.55rem 1rem;font-weight:600}
.tabs button[aria-current="page"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.days{display:grid;gap:.9rem}
.day{background:var(--surface);border:1px solid var(--line);border-radius:.9rem;padding:.4rem 1.1rem 1.1rem}
.day h3{font-size:1.35rem;margin-top:.6rem}
.day label{margin-top:.7rem}
.day .pick .btn{font-size:.95rem}
.day .btn[disabled]{cursor:default}
</style>
</head>
<body>
<div class="wrap">

  <nav id="tabs" class="tabs" aria-label="Secciones">
    <button data-go="list" aria-current="page">Recetas</button>
    <button data-go="menu" aria-current="false">Menú semanal</button>
  </nav>

  <!-- LISTA -->
  <div id="v-list" class="view on">
    <header>
      <h1>Mi recetario</h1>
      <p id="count">Tus recetas, siempre a mano.</p>
      <p class="sync-line"><span id="sync-status">Cargando recetas…</span> · <button class="link" data-go="sync">Sincronización</button></p>
    </header>
    <div class="bar">
      <input id="q" class="search" type="search" placeholder="Buscar receta, ingrediente o autor…" aria-label="Buscar">
    </div>
    <div id="chips" class="chips" role="group" aria-label="Filtrar por categoría"></div>
    <div id="list" class="list"></div>
  </div>

  <!-- MENÚ SEMANAL -->
  <div id="v-menu" class="view">
    <header>
      <h1>Menú semanal</h1>
      <p>Elige una receta de desayuno, comida y cena para cada día. Salen las recetas de las categorías Desayunos, Comidas y Cenas.</p>
    </header>
    <form id="menu-form">
      <div id="menu-days" class="days"></div>
      <div class="actions">
        <button type="submit" class="btn btn-main">Guardar menú</button>
        <button type="button" class="btn btn-danger" id="menu-clear">Vaciar menú</button>
      </div>
    </form>
  </div>

  <!-- DETALLE -->
  <div id="v-detail" class="view detail"></div>

  <!-- FORMULARIO -->
  <div id="v-form" class="view">
    <button class="back" data-go="list">‹ Volver</button>
    <h2 id="form-title" style="font-size:2rem">Nueva receta</h2>
    <form id="form">
      <label for="f-name">Nombre</label>
      <input id="f-name" required placeholder="Tortilla de patatas">
      <div class="row">
        <div><label for="f-cat">Categoría</label>
          <div class="pick"><select id="f-cat"></select><button type="button" class="btn btn-ghost" id="add-cat" aria-label="Añadir categoría" title="Añadir categoría">+</button></div></div>
        <div><label for="f-time">Tiempo (min)</label>
          <input id="f-time" type="number" min="0" inputmode="numeric" placeholder="40"></div>
        <div><label for="f-serv">Raciones</label>
          <input id="f-serv" type="number" min="1" inputmode="numeric" placeholder="4"></div>
      </div>
      <label for="f-author">Hecha por</label>
      <div class="pick">
        <select id="f-author"></select>
        <button type="button" class="btn btn-ghost" id="add-author" aria-label="Añadir nombre" title="Añadir nombre">+</button>
      </div>
      <label for="f-ing">Ingredientes <span class="hint">· uno por línea</span></label>
      <textarea id="f-ing" placeholder="6 huevos&#10;4 patatas&#10;1 cebolla&#10;Aceite de oliva&#10;Sal"></textarea>
      <label for="f-steps">Pasos <span class="hint">· uno por línea</span></label>
      <textarea id="f-steps" placeholder="Pelar y cortar las patatas en láminas finas&#10;Freírlas a fuego medio con la cebolla&#10;Batir los huevos y mezclar"></textarea>
      <label for="f-notes">Notas</label>
      <textarea id="f-notes" style="min-height:4.5rem" placeholder="Truco de la abuela, variaciones…"></textarea>
      <div class="actions">
        <button type="submit" class="btn btn-main">Guardar receta</button>
        <button type="button" class="btn btn-ghost" data-go="list">Cancelar</button>
      </div>
    </form>
  </div>

  <!-- SINCRONIZACIÓN -->
  <div id="v-sync" class="view">
    <button class="back" data-go="list">‹ Volver</button>
    <form id="sync-form">
      <h2 style="font-size:2rem;margin-bottom:.8rem"><label for="f-token" style="font-weight:400;margin:0">Token</label></h2>
      <input id="f-token" type="password" autocomplete="off" placeholder="github_pat_…">
      <div class="actions">
        <button type="submit" class="btn btn-main">Guardar</button>
        <button type="button" class="btn btn-danger" id="forget">Olvidar token</button>
      </div>
    </form>
  </div>
</div>

<button id="add" class="btn btn-main fab">+ Nueva receta</button>
<div id="toast" class="toast" role="status"></div>

<script>
const CATS=["Desayunos","Comidas","Cenas","Entrantes","Postres","Bebidas"];
const OLD_KEY="recetario-v1", CACHE_KEY="recetario-cache-v2", TOKEN_KEY="recetario-token", MENU_CACHE_KEY="recetario-menu";
const REPO="antoniogarfer12/Recetario-nova-pelosa", FILE="recetas.json", MENU_FILE="menu.json", BRANCH="main";
const apiUrl=file=>`https://api.github.com/repos/${REPO}/contents/${file}`;
const DAYS=["Lunes","Martes","Miércoles","Jueves","Viernes","Sábado","Domingo"];
const MEALS=[["desayuno","Desayuno"],["comida","Comida"],["cena","Cena"]];
let recipes=[], filter="Todas", editingId=null, token="", menu={}, mainView="list";

const store={
  get(k){try{return localStorage.getItem(k);}catch(e){return null;}},
  set(k,v){try{localStorage.setItem(k,v);}catch(e){}},
  del(k){try{localStorage.removeItem(k);}catch(e){}}
};
const parseList=s=>{try{const x=JSON.parse(s);return Array.isArray(x)?x:[];}catch(e){return [];}};
const parseObj=s=>{try{const x=JSON.parse(s);return x&&typeof x==="object"&&!Array.isArray(x)?x:{};}catch(e){return {};}};
const b64enc=s=>{let bin="";new TextEncoder().encode(s).forEach(b=>bin+=String.fromCharCode(b));return btoa(bin);};
const b64dec=s=>new TextDecoder().decode(Uint8Array.from(atob(s.replace(/\s/g,"")),c=>c.charCodeAt(0)));

function setStatus(msg){$("#sync-status").textContent=msg;}

// Lee un JSON del repositorio (devuelve el contenido y el sha para poder escribir después)
async function fetchRemote(file=FILE,parse=parseList){
  const h={Accept:"application/vnd.github+json"};
  if(token) h.Authorization="Bearer "+token;
  const res=await fetch(`${apiUrl(file)}?ref=${BRANCH}`,{headers:h,cache:"no-store"});
  if(res.status===404) return {list:parse(""),sha:null};
  if(!res.ok) throw new Error(res.status===401?"Token no válido o caducado":"GitHub respondió "+res.status);
  const j=await res.json();
  return {list:parse(b64dec(j.content)),sha:j.sha};
}
async function putRemote(list,sha,message,file=FILE){
  const res=await fetch(apiUrl(file),{method:"PUT",headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+token,"Content-Type":"application/json"},
    body:JSON.stringify({message,branch:BRANCH,sha:sha||undefined,content:b64enc(JSON.stringify(list,null,2)+"\n")})});
  if(res.status===409||res.status===422) throw Object.assign(new Error("conflict"),{conflict:true});
  if(!res.ok) throw new Error(res.status===401||res.status===403?"El token no tiene permiso de escritura":"GitHub respondió "+res.status);
}

// Aplica un cambio sobre la versión más reciente del repo y la sube (reintenta si otro dispositivo escribió a la vez)
async function mutate(fn,message){
  if(!token){toast("Configura la sincronización para guardar cambios");show("sync");return false;}
  setStatus("Guardando en GitHub…");
  try{
    for(let i=0;;i++){
      const {list,sha}=await fetchRemote();
      fn(list);
      try{await putRemote(list,sha,message);recipes=list;break;}
      catch(e){if(!e.conflict||i>=2) throw e;}
    }
    store.set(CACHE_KEY,JSON.stringify(recipes));
    setStatus("Sincronizado");
    return true;
  }catch(e){
    setStatus("Error al guardar: "+e.message);
    toast("No se ha podido guardar en GitHub");
    return false;
  }
}

// Sube recetas que se guardaron solo en este navegador con la versión antigua de la app
async function migrateLocal(){
  const old=parseList(store.get(OLD_KEY));
  if(!old.length||!token) return;
  const ok=await mutate(list=>{old.forEach(r=>{if(!list.some(x=>x.id===r.id)) list.push(r);});},`Subir ${old.length} receta(s) guardadas en el navegador`);
  if(ok){store.del(OLD_KEY);toast("Recetas antiguas subidas a GitHub");}
}

// El menú se guarda entero: se sobrescribe menu.json con lo que hay en pantalla
async function saveMenu(){
  if(!token){toast("Configura la sincronización para guardar cambios");show("sync");return false;}
  setStatus("Guardando en GitHub…");
  try{
    for(let i=0;;i++){
      const {sha}=await fetchRemote(MENU_FILE,parseObj);
      try{await putRemote(menu,sha,"Actualizar menú semanal",MENU_FILE);break;}
      catch(e){if(!e.conflict||i>=2) throw e;}
    }
    store.set(MENU_CACHE_KEY,JSON.stringify(menu));
    setStatus("Sincronizado");
    return true;
  }catch(e){
    setStatus("Error al guardar: "+e.message);
    toast("No se ha podido guardar en GitHub");
    return false;
  }
}

async function sync(){
  try{
    const [{list},m]=await Promise.all([fetchRemote(),fetchRemote(MENU_FILE,parseObj)]);
    recipes=list; store.set(CACHE_KEY,JSON.stringify(recipes));
    menu=m.list; store.set(MENU_CACHE_KEY,JSON.stringify(menu));
    setStatus(token?"Sincronizado":"Solo lectura");
    await migrateLocal();
  }catch(e){
    setStatus("Sin conexión con GitHub ("+e.message+"), mostrando copia local");
  }
  renderList();
  if(mainView==="menu"&&$("#v-menu").classList.contains("on")) renderMenu();
}

function load(){
  token=store.get(TOKEN_KEY)||"";
  recipes=parseList(store.get(CACHE_KEY));
  if(!recipes.length) recipes=parseList(store.get(OLD_KEY));
  menu=parseObj(store.get(MENU_CACHE_KEY));
}
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const lines=s=>s.split("\n").map(x=>x.trim()).filter(Boolean);

function toast(msg){const t=$("#toast");t.textContent=msg;t.classList.add("on");clearTimeout(t._h);t._h=setTimeout(()=>t.classList.remove("on"),1800);}

function show(v){
  document.querySelectorAll(".view").forEach(x=>x.classList.toggle("on",x.id==="v-"+v));
  if(v==="list"||v==="menu") mainView=v;
  $("#add").style.display=v==="list"?"":"none";
  $("#tabs").style.display=v==="list"||v==="menu"?"":"none";
  document.querySelectorAll("#tabs [data-go]").forEach(b=>b.setAttribute("aria-current",b.dataset.go===v?"page":"false"));
  window.scrollTo(0,0);
}

// Qué comida del menú corresponde a una categoría (admite "Comida"/"Comidas", con o sin tilde)
const mealOf=cat=>{
  const c=String(cat||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"");
  return c.startsWith("desayun")?"desayuno":c.startsWith("comida")?"comida":c.startsWith("cena")?"cena":null;
};

function renderMenu(){
  const byMeal={};
  MEALS.forEach(([k])=>byMeal[k]=recipes.filter(r=>mealOf(r.cat)===k).sort((a,b)=>a.name.localeCompare(b.name,"es")));
  $("#menu-days").innerHTML=DAYS.map(d=>`
    <section class="day"><h3>${d}</h3>
      ${MEALS.map(([k,label])=>{
        const sel=menu[d]?.[k]||"";
        const opts=byMeal[k].slice();
        const cur=recipes.find(r=>r.id===sel);
        if(cur&&!opts.includes(cur)) opts.unshift(cur);
        const id=`m-${DAYS.indexOf(d)}-${k}`;
        return `<label for="${id}">${label}</label>
        <div class="pick">
          <select id="${id}" data-day="${d}" data-meal="${k}">
            <option value="">${opts.length?"— Sin elegir —":`— No hay recetas de ${label.toLowerCase()} —`}</option>
            ${opts.map(r=>`<option value="${r.id}"${r.id===sel?" selected":""}>${esc(r.name)}</option>`).join("")}
          </select>
          <button type="button" class="btn btn-ghost" data-open="${cur?cur.id:""}"${cur?"":" disabled"}>Ver</button>
        </div>`;}).join("")}
    </section>`).join("");
}

function renderChips(){
  const used=["Todas","Favoritas",...allCats().filter(c=>recipes.some(r=>r.cat===c))];
  $("#chips").innerHTML=used.map(c=>`<button class="chip" aria-pressed="${c===filter}" data-chip="${esc(c)}">${esc(c)}</button>`).join("");
}

function renderList(){
  renderChips();
  const q=$("#q").value.trim().toLowerCase();
  let items=recipes.slice().sort((a,b)=>b.updated-a.updated);
  if(filter==="Favoritas") items=items.filter(r=>r.fav);
  else if(filter!=="Todas") items=items.filter(r=>r.cat===filter);
  if(q) items=items.filter(r=>(r.name+" "+(r.author||"")+" "+r.ing.join(" ")).toLowerCase().includes(q));
  $("#count").textContent=recipes.length?`${recipes.length} receta${recipes.length>1?"s":""} guardada${recipes.length>1?"s":""}.`:"Tus recetas, siempre a mano.";
  if(!recipes.length){
    $("#list").innerHTML=`<div class="empty"><h2>Aún no hay recetas</h2><p>Apunta la primera con el botón “Nueva receta”.</p></div>`;return;
  }
  if(!items.length){$("#list").innerHTML=`<div class="empty"><p>Ninguna receta coincide. Prueba con otra palabra o categoría.</p></div>`;return;}
  $("#list").innerHTML=items.map(r=>`
    <button class="card" data-open="${r.id}">
      ${r.fav?'<span class="fav" aria-label="Favorita">★</span>':""}
      <h3>${esc(r.name)}</h3>
      <div class="meta"><span>${esc(r.cat)}</span>${r.author?`<span>por ${esc(r.author)}</span>`:""}${r.time?`<span>${r.time} min</span>`:""}${r.serv?`<span>${r.serv} raciones</span>`:""}<span>${r.ing.length} ingredientes</span></div>
    </button>`).join("");
}

function renderDetail(id){
  const r=recipes.find(x=>x.id===id); if(!r) return show("list");
  $("#v-detail").innerHTML=`
    <button class="back" data-go="${mainView}">‹ ${mainView==="menu"?"Volver al menú":"Todas las recetas"}</button>
    <h2>${esc(r.name)}</h2>
    <div class="meta"><span>${esc(r.cat)}</span>${r.author?`<span>por ${esc(r.author)}</span>`:""}${r.time?`<span>${r.time} min</span>`:""}${r.serv?`<span>${r.serv} raciones</span>`:""}</div>
    ${r.ing.length?`<section><h3>Ingredientes</h3><ul class="ing">${r.ing.map((i,n)=>`<li><input type="checkbox" id="i${n}" aria-label="Tengo ${esc(i)}"><span>${esc(i)}</span></li>`).join("")}</ul></section>`:""}
    ${r.steps.length?`<section><h3>Preparación</h3><ol class="steps">${r.steps.map(s=>`<li>${esc(s)}</li>`).join("")}</ol></section>`:""}
    ${r.notes?`<section><h3>Notas</h3><div class="notes">${esc(r.notes)}</div></section>`:""}
    <div class="actions">
      <button class="btn btn-main" data-fav="${r.id}">${r.fav?"Quitar de favoritas":"Marcar como favorita"}</button>
      <button class="btn btn-ghost" data-edit="${r.id}">Editar</button>
      <button class="btn btn-danger" data-del="${r.id}">Borrar</button>
    </div>`;
  show("detail");
}

function openForm(id){
  editingId=id||null;
  const r=id?recipes.find(x=>x.id===id):null;
  $("#form-title").textContent=r?"Editar receta":"Nueva receta";
  $("#f-name").value=r?.name||"";
  fillCats(r?.cat||"Comidas");
  fillAuthors(r?.author||store.get(AUTHOR_KEY)||"");
  $("#f-time").value=r?.time||"";
  $("#f-serv").value=r?.serv||"";
  $("#f-ing").value=r?r.ing.join("\n"):"";
  $("#f-steps").value=r?r.steps.join("\n"):"";
  $("#f-notes").value=r?.notes||"";
  show("form"); $("#f-name").focus();
}

// Categorías: las fijas, más las que ya usan las recetas, más las añadidas con "+"
let extraCats=[];
function allCats(){
  const custom=[...new Set([...recipes.map(r=>r.cat),...extraCats].filter(c=>c&&!CATS.includes(c)))]
    .sort((a,b)=>a.localeCompare(b,"es"));
  return [...CATS,...custom];
}
function fillCats(selected){
  if(selected&&!allCats().includes(selected)) extraCats.push(selected);
  $("#f-cat").innerHTML=allCats().map(c=>`<option>${esc(c)}</option>`).join("");
  $("#f-cat").value=selected;
}
$("#add-cat").addEventListener("click",()=>{
  const name=(prompt("Nombre de la nueva categoría:")||"").trim().replace(/\s+/g," ");
  if(!name) return;
  const existing=allCats().find(c=>c.toLowerCase()===name.toLowerCase());
  if(existing){$("#f-cat").value=existing;return;}
  extraCats.push(name); fillCats(name);
});

// Los nombres del desplegable salen de las recetas ya guardadas, más los añadidos con "+"
const AUTHOR_KEY="recetario-ultimo-autor";
let extraAuthors=[];
function fillAuthors(selected){
  const names=[...new Set([...recipes.map(r=>r.author),...extraAuthors,selected].filter(Boolean))]
    .sort((a,b)=>a.localeCompare(b,"es"));
  $("#f-author").innerHTML=`<option value="">— Sin indicar —</option>`+names.map(n=>`<option>${esc(n)}</option>`).join("");
  $("#f-author").value=selected||"";
}
$("#add-author").addEventListener("click",()=>{
  const name=(prompt("Nombre de quien ha hecho la receta:")||"").trim().replace(/\s+/g," ");
  if(!name) return;
  const existing=[...$("#f-author").options].find(o=>o.value.toLowerCase()===name.toLowerCase());
  if(existing){$("#f-author").value=existing.value;return;}
  extraAuthors.push(name); fillAuthors(name);
});

$("#form").addEventListener("submit",async e=>{
  e.preventDefault();
  const data={
    name:$("#f-name").value.trim(),
    cat:$("#f-cat").value,
    author:$("#f-author").value,
    time:parseInt($("#f-time").value)||null,
    serv:parseInt($("#f-serv").value)||null,
    ing:lines($("#f-ing").value),
    steps:lines($("#f-steps").value),
    notes:$("#f-notes").value.trim(),
    updated:Date.now()
  };
  if(!data.name) return;
  const id=editingId||Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const btn=e.submitter||$("#form [type=submit]"); btn.disabled=true;
  const ok=await mutate(list=>{
    const r=list.find(x=>x.id===id);
    if(r) Object.assign(r,data); else list.push({id,fav:false,...data});
  },(editingId?"Editar":"Añadir")+" receta: "+data.name);
  btn.disabled=false;
  if(ok&&data.author) store.set(AUTHOR_KEY,data.author);
  if(ok){toast("Receta guardada"); renderList(); renderDetail(id);}
});

$("#sync-form").addEventListener("submit",async e=>{
  e.preventDefault();
  const t=$("#f-token").value.trim(); if(!t) return;
  const btn=e.submitter||$("#sync-form [type=submit]"); btn.disabled=true;
  try{
    const res=await fetch(`https://api.github.com/repos/${REPO}`,{headers:{Accept:"application/vnd.github+json",Authorization:"Bearer "+t}});
    if(!res.ok) throw new Error("token no válido");
    const j=await res.json();
    if(!j.permissions?.push) throw new Error("el token no tiene permiso de escritura en el repositorio");
    token=t; store.set(TOKEN_KEY,t); $("#f-token").value="";
    toast("Sincronización activada"); show("list"); await sync();
  }catch(err){toast("No funciona: "+err.message);}
  btn.disabled=false;
});
$("#forget").addEventListener("click",()=>{token="";store.del(TOKEN_KEY);setStatus("Solo lectura");toast("Token olvidado en este dispositivo");});

document.addEventListener("click",async e=>{
  const t=e.target.closest("button,li"); if(!t) return;
  if(t.dataset.go){
    if(t.dataset.go==="list"){renderList();show("list");}
    else if(t.dataset.go==="menu"){renderMenu();show("menu");}
    else show(t.dataset.go);
  }
  else if(t.dataset.chip){filter=t.dataset.chip;renderList();}
  else if(t.dataset.open){renderDetail(t.dataset.open);}
  else if(t.dataset.edit){openForm(t.dataset.edit);}
  else if(t.dataset.fav){
    const id=t.dataset.fav, fav=!recipes.find(x=>x.id===id)?.fav;
    t.disabled=true;
    if(await mutate(list=>{const r=list.find(x=>x.id===id);if(r) r.fav=fav;},(fav?"Marcar":"Desmarcar")+" favorita")) toast(fav?"Añadida a favoritas":"Quitada de favoritas");
    renderDetail(id);
  }
  else if(t.dataset.del){
    const r=recipes.find(x=>x.id===t.dataset.del);
    if(confirm(`¿Borrar “${r.name}”? No se puede deshacer.`)){
      t.disabled=true;
      if(await mutate(list=>{const i=list.findIndex(x=>x.id===r.id);if(i>=0) list.splice(i,1);},"Borrar receta: "+r.name)){renderList();show("list");toast("Receta borrada");}
      else t.disabled=false;
    }
  }
  else if(t.id==="add"){ if(token) openForm(); else {toast("Configura la sincronización para añadir recetas");show("sync");} }
});
document.addEventListener("change",e=>{
  if(e.target.matches(".ing input")) e.target.closest("li").classList.toggle("done",e.target.checked);
  if(e.target.matches("#menu-days select")){
    const {day,meal}=e.target.dataset, v=e.target.value;
    menu[day]=menu[day]||{};
    if(v) menu[day][meal]=v; else delete menu[day][meal];
    if(!Object.keys(menu[day]).length) delete menu[day];
    const ver=e.target.nextElementSibling; ver.dataset.open=v; ver.disabled=!v;
  }
});
$("#menu-form").addEventListener("submit",async e=>{
  e.preventDefault();
  const btn=e.submitter||$("#menu-form [type=submit]"); btn.disabled=true;
  if(await saveMenu()) toast("Menú guardado");
  btn.disabled=false;
});
$("#menu-clear").addEventListener("click",async()=>{
  if(!confirm("¿Vaciar el menú de toda la semana?")) return;
  menu={}; renderMenu();
  if(await saveMenu()) toast("Menú vaciado");
});
$("#q").addEventListener("input",renderList);

load(); renderList(); sync();
</script>
</body>
</html>
